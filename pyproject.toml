[project]
name = "agente-viaticos"
version = "0.1.0"
description = "Agente y API de solicitudes de viáticos de Altiplano."
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "google-genai>=2.28.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.fastapi]
entrypoint = "api:app"
